/* ===================== CHARTS (canvas, no libraries so it works offline) ===================== */
function drawChart(cv, series, {fmt = v => Math.round(v), bars = false} = {}){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 340, H = cv.clientHeight || 220;
  cv.width = W * dpr; cv.height = H * dpr;
  const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);
  const pts = series.flatMap(s => s.pts);
  c.font = "600 11px -apple-system, system-ui, sans-serif";
  if (!pts.length){ c.fillStyle = "#8C95A3"; c.textAlign = "center"; c.fillText("No data yet", W / 2, H / 2); return; }
  const L = 44, R = 14, T = 16, B = 26;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1){ x0 -= 864e5 * 3; x1 += 864e5 * 3; }
  let y0 = bars ? 0 : Math.min(...ys), y1 = Math.max(...ys);
  if (y0 === y1){ y0 -= Math.max(1, Math.abs(y0) * .05); y1 += Math.max(1, Math.abs(y1) * .05); }
  const padY = (y1 - y0) * .12; if (!bars) y0 -= padY; y1 += padY;
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R), Y = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  c.strokeStyle = "#252B35"; c.lineWidth = 1; c.fillStyle = "#8C95A3"; c.textAlign = "right"; c.textBaseline = "middle";
  for (let i = 0; i <= 4; i++){ const v = y0 + (y1 - y0) * i / 4, y = Y(v); c.beginPath(); c.moveTo(L, y); c.lineTo(W - R, y); c.stroke(); c.fillText(fmt(v), L - 6, y); }
  c.textAlign = "center"; c.textBaseline = "top";
  const fx = x => { const d = new Date(x); return `${MON[d.getMonth()]} ${d.getDate()}`; };
  const xt = [...new Set([Math.min(...xs), Math.max(...xs)])];
  if (xt.length === 2 && (X(xt[1]) - X(xt[0])) > 160) xt.splice(1, 0, (xt[0] + xt[1]) / 2);
  xt.forEach(x => { c.textAlign = X(x) < L + 30 ? "left" : X(x) > W - R - 30 ? "right" : "center"; c.fillText(fx(x), X(x), H - B + 8); });
  series.forEach(s => {
    const p = s.pts.slice().sort((a, b) => a.x - b.x); if (!p.length) return;
    c.strokeStyle = s.color; c.fillStyle = s.color;
    if (bars){
      const bw = Math.max(6, Math.min(26, (W - L - R) / Math.max(p.length, 1) * .55));
      p.forEach(q => { const x = X(q.x) - bw / 2, y = Y(q.y); c.globalAlpha = .85; c.beginPath(); c.roundRect ? c.roundRect(x, y, bw, Y(0) - y, 4) : c.rect(x, y, bw, Y(0) - y); c.fill(); c.globalAlpha = 1; });
      return;
    }
    // soft fill under the first series
    if (s.fill && p.length > 1){ const g = c.createLinearGradient(0, T, 0, H - B); g.addColorStop(0, s.color + "55"); g.addColorStop(1, s.color + "00"); c.fillStyle = g; c.beginPath(); c.moveTo(X(p[0].x), H - B); p.forEach(q => c.lineTo(X(q.x), Y(q.y))); c.lineTo(X(p[p.length - 1].x), H - B); c.fill(); c.fillStyle = s.color; }
    c.lineWidth = 2.5; c.lineJoin = "round"; c.beginPath(); p.forEach((q, i) => i ? c.lineTo(X(q.x), Y(q.y)) : c.moveTo(X(q.x), Y(q.y))); c.stroke();
    p.forEach(q => { c.beginPath(); c.arc(X(q.x), Y(q.y), q.pr ? 5.5 : 3.5, 0, 7); c.fillStyle = q.pr ? "#FACC15" : s.color; c.fill(); });
  });
}

/* ===================== PROGRESS ===================== */
let progTab = "lifts", progEx = null;
function loggedExercises(){
  const m = new Map();
  finished().forEach(w => w.ex.forEach(e => { if (!doneSets(e).length) return; const k = exKey(e.name); const cur = m.get(k) || {key: k, name: e.name, n: 0, last: ""}; cur.n++; cur.last = w.date; cur.name = e.name; m.set(k, cur); }));
  return [...m.values()].sort((a, b) => b.last.localeCompare(a.last) || b.n - a.n);
}
function renderProgress(){
  const el = $("#progressBody");
  el.innerHTML = `<h2 class="title">Progress</h2>
    <div class="seg" id="progSeg" style="margin:8px 0 12px"><button data-t="lifts" class="${progTab === "lifts" ? "on" : ""}">🏋️ Lifts</button><button data-t="body" class="${progTab === "body" ? "on" : ""}">⚖️ Body</button></div>
    <div id="progInner"></div>`;
  $("#progSeg").onclick = e => { const b = e.target.closest("[data-t]"); if (b){ progTab = b.dataset.t; renderProgress(); } };
  progTab === "lifts" ? renderLifts() : renderBody();
}
function renderLifts(){
  const el = $("#progInner"), exs = loggedExercises();
  if (!exs.length){ el.innerHTML = `<div class="empty"><div class="big">📈</div>Finish a workout and your lifts will chart here.</div>`; return; }
  if (!progEx || !exs.some(x => x.key === progEx)) progEx = exs[0].key;
  const h = exHistory(progEx), meta = exs.find(x => x.key === progEx), type = h[0].type;
  const weighted = type !== "t" && h.some(x => x.top > 0);
  // PR flags along the timeline
  let run = -Infinity; const prFlag = h.map(x => { const v = x.best ? x.best.val : 0; const isPr = run > -Infinity && v > run + 1e-9; run = Math.max(run, v); return isPr; });
  const conv = v => isKg() ? v / KG : v;
  const X = d => parseYmd(d).getTime();
  let series1, s1legend, fmt1, series2, s2label;
  if (type === "t"){ series1 = [{color: "#FF6B3D", fill: true, pts: h.map((x, i) => ({x: X(x.date), y: x.maxT, pr: prFlag[i]}))}]; s1legend = `<span><i style="background:#FF6B3D"></i>Longest set (sec)</span>`; fmt1 = v => Math.round(v) + "s"; series2 = h.map(x => ({x: X(x.date), y: x.vol})); s2label = "Total time per session (sec)"; }
  else if (weighted){
    series1 = [{color: "#FF6B3D", fill: true, pts: h.filter(x => x.best && x.best.kind === "e1rm").map(x => ({x: X(x.date), y: conv(x.best.val), pr: prFlag[h.indexOf(x)]}))},
               {color: "#60A5FA", pts: h.filter(x => x.top > 0).map(x => ({x: X(x.date), y: conv(x.top)}))}];
    s1legend = `<span><i style="background:#FF6B3D"></i>Est. 1RM</span><span><i style="background:#60A5FA"></i>Heaviest set</span><span><i style="background:#FACC15;border-radius:50%"></i>PR</span>`;
    fmt1 = v => Math.round(v); series2 = h.map(x => ({x: X(x.date), y: conv(x.vol)})); s2label = `Volume per session (${wUnit()} × reps)`;
  } else { series1 = [{color: "#FF6B3D", fill: true, pts: h.map((x, i) => ({x: X(x.date), y: x.maxR, pr: prFlag[i]}))}]; s1legend = `<span><i style="background:#FF6B3D"></i>Most reps in a set</span>`; fmt1 = v => Math.round(v); series2 = h.map(x => ({x: X(x.date), y: x.sets.reduce((a, s) => a + (s.r || 0), 0)})); s2label = "Total reps per session"; }
  // stats
  const bestE = Math.max(...h.map(x => x.best && x.best.kind === "e1rm" ? x.best.val : 0));
  const bestRow = h.find(x => x.best && x.best.kind === "e1rm" && x.best.val === bestE);
  const heaviest = Math.max(...h.map(x => x.top));
  const firstE = h.find(x => x.best && x.best.kind === "e1rm");
  const change = firstE && bestE ? Math.round((bestE - firstE.best.val) / firstE.best.val * 100) : null;
  const prCount = prFlag.filter(Boolean).length;
  el.innerHTML = `
    <div class="field"><label for="progSel">Exercise</label><select class="inp" id="progSel">${exs.map(x => `<option value="${x.key}"${x.key === progEx ? " selected" : ""}>${esc(x.name)} (${x.n})</option>`).join("")}</select></div>
    <div class="card"><h3>${type === "t" ? "Longest hold" : weighted ? "Strength" : "Reps"} <span class="small muted">${h.length} session${h.length > 1 ? "s" : ""}</span></h3>
      <canvas class="chart" id="ch1"></canvas><div class="legend">${s1legend}</div>
      <div class="kv">
        ${weighted ? `<div class="stat"><b>${Math.round(conv(bestE))}</b><span>Best est. 1RM ${wUnit()}</span></div><div class="stat"><b>${bestRow ? fmtSet(bestRow.best.set, "wr") : "–"}</b><span>Best set</span></div>
        <div class="stat"><b>${toW(heaviest)}</b><span>Heaviest ${wUnit()}</span></div><div class="stat"><b>${change != null ? (change >= 0 ? "+" : "") + change + "%" : "–"}</b><span>1RM since first log</span></div>`
        : type === "t" ? `<div class="stat"><b>${fmtSec(Math.max(...h.map(x => x.maxT)))}</b><span>Longest</span></div><div class="stat"><b>${prCount}</b><span>PRs</span></div>`
        : `<div class="stat"><b>${Math.max(...h.map(x => x.maxR))}</b><span>Most reps</span></div><div class="stat"><b>${prCount}</b><span>PRs</span></div>`}
      </div></div>
    <div class="card"><h3>${type === "t" ? "Time" : weighted ? "Volume" : "Total reps"}</h3><canvas class="chart" id="ch2" style="height:170px"></canvas><div class="legend"><span><i style="background:#34D399"></i>${s2label}</span></div></div>
    <div class="card"><h3>Sessions</h3>${h.slice().reverse().slice(0, 12).map((x, ri) => { const i = h.length - 1 - ri; return `<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><span class="small muted" style="width:56px">${fmtDate(x.date)}</span><span class="grow small">${x.sets.map(s => fmtSet(s, type)).join(" · ")}</span>${prFlag[i] ? `<span class="tag pr">PR</span>` : ""}</div>`; }).join("")}</div>`;
  $("#progSel").onchange = e => { progEx = e.target.value; renderLifts(); };
  requestAnimationFrame(() => { drawChart($("#ch1"), series1, {fmt: fmt1}); drawChart($("#ch2"), [{color: "#34D399", pts: series2}], {bars: true, fmt: v => v >= 10000 ? (v / 1000).toFixed(0) + "k" : v >= 1000 ? (v / 1000).toFixed(1) + "k" : Math.round(v)}); });
}
function renderBody(){
  const el = $("#progInner");
  const list = S.body.slice().sort((a, b) => a.date.localeCompare(b.date));
  const wts = list.filter(x => x.weight != null), wst = list.filter(x => x.waist != null);
  const delta = (arr, f, days) => {
    if (arr.length < 2) return null; const last = arr[arr.length - 1];
    const cutoff = ymd(addDays(parseYmd(last.date), -days));
    const base = days ? (arr.filter(x => x.date <= cutoff).pop() || arr[0]) : arr[0];
    if (base === last) return null; return f(last) - f(base);
  };
  const sign = v => v == null ? "–" : (v > 0 ? "+" : "") + trim1(v);
  const dW30 = delta(wts, x => +toW(x.weight), 30), dWa30 = delta(wst, x => +toLen(x.waist), 30);
  let insight = "";
  if (dW30 != null && dWa30 != null){
    if (dWa30 < 0 && Math.abs(dW30) <= (isKg() ? 1 : 2)) insight = "Waist down while weight holds steady: that's recomp working. 👌";
    else if (dWa30 < 0 && dW30 < 0) insight = "Weight and waist both trending down. Keep protein high to hold onto muscle.";
    else if (dWa30 > 0 && dW30 > 0) insight = "Weight and waist both up over the last month. Worth a check-in with your coach.";
  }
  el.innerHTML = `
    <div class="card"><h3>Log body stats</h3>
      <div class="field"><label for="bDate">Date</label><input class="inp" type="date" id="bDate" value="${ymd()}" max="${ymd()}"></div>
      <div class="row"><div class="field grow"><label for="bW">Weight (${wUnit()})</label><input class="inp" id="bW" inputmode="decimal" placeholder="${wts.length ? toW(wts[wts.length - 1].weight) : isKg() ? "88" : "195"}"></div>
      <div class="field grow"><label for="bWa">Waist (${lenUnit()})</label><input class="inp" id="bWa" inputmode="decimal" placeholder="${wst.length ? toLen(wst[wst.length - 1].waist) : isKg() ? "96" : "38"}"></div></div>
      <button class="btn primary" id="bSave">Save</button>
      <p class="small muted" style="margin-top:10px;line-height:1.45">Tip: weigh in the morning, after the bathroom, before eating. Measure your waist at the belly button. For recomp, the waist trend tells you more than the scale.</p></div>
    ${insight ? `<div class="card" style="border-color:rgba(52,211,153,.4)"><b>Trend</b><div class="small" style="margin-top:4px;line-height:1.45">${insight}</div></div>` : ""}
    <div class="card"><h3>Body weight <span class="small muted">${wts.length ? `${toW(wts[wts.length - 1].weight)} ${wUnit()}` : ""}</span></h3><canvas class="chart" id="chW"></canvas>
      <div class="kv"><div class="stat"><b>${sign(dW30)}</b><span>${wUnit()} · last 30 days</span></div><div class="stat"><b>${sign(delta(wts, x => +toW(x.weight), 0))}</b><span>${wUnit()} · since start</span></div></div></div>
    <div class="card"><h3>Waist <span class="small muted">${wst.length ? `${toLen(wst[wst.length - 1].waist)} ${lenUnit()}` : ""}</span></h3><canvas class="chart" id="chWa"></canvas>
      <div class="kv"><div class="stat"><b>${sign(dWa30)}</b><span>${lenUnit()} · last 30 days</span></div><div class="stat"><b>${sign(delta(wst, x => +toLen(x.waist), 0))}</b><span>${lenUnit()} · since start</span></div></div></div>
    <div class="card"><h3>Entries</h3>${list.length ? list.slice().reverse().map(x => `<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><span class="grow">${fmtDate(x.date)}</span><span class="small" style="width:90px">${x.weight != null ? `${toW(x.weight)} ${wUnit()}` : "–"}</span><span class="small" style="width:70px">${x.waist != null ? `${toLen(x.waist)} ${lenUnit()}` : "–"}</span><button class="icon-btn" style="width:40px;height:40px;font-size:16px" data-bdel="${x.id}" aria-label="Delete entry">✕</button></div>`).join("") : `<div class="small muted">No entries yet.</div>`}</div>`;
  $("#bSave").onclick = () => {
    const w = fromW($("#bW").value), wa = fromLen($("#bWa").value), d = $("#bDate").value || ymd();
    if (w == null && wa == null) return toast("Enter weight and/or waist");
    const ex = S.body.find(x => x.date === d);
    if (ex){ if (w != null) ex.weight = w; if (wa != null) ex.waist = wa; } else S.body.push({id: uid(), date: d, weight: w, waist: wa});
    save(); renderBody(); toast("Saved ✓");
  };
  el.onclick = async e => { const b = e.target.closest("[data-bdel]"); if (!b) return; if (!(await confirmBox("Delete this entry?", {ok: "Delete", danger: true}))) return; S.body = S.body.filter(x => x.id !== b.dataset.bdel); save(); renderBody(); };
  requestAnimationFrame(() => {
    drawChart($("#chW"), [{color: "#60A5FA", fill: true, pts: wts.map(x => ({x: parseYmd(x.date).getTime(), y: +toW(x.weight)}))}], {fmt: v => trim1(v)});
    drawChart($("#chWa"), [{color: "#FF6B3D", fill: true, pts: wst.map(x => ({x: parseYmd(x.date).getTime(), y: +toLen(x.waist)}))}], {fmt: v => trim1(v)});
  });
}

}
function renameSheet(tp){

function exportData(){
  const payload = {app: "lift-log", version: 2, exportedAt: new Date().toISOString(), data: {...S, active: S.active, restEnd: null}};
  const json = JSON.stringify(payload, null, 1);
  const name = `lift-log-backup-${ymd()}.json`;
  const blob = new Blob([json], {type: "application/json"});
  const done = () => { S.settings.lastBackup = Date.now(); save(); renderMe(); toast("Backup exported ✓"); };
  const file = typeof File === "function" ? new File([blob], name, {type: "application/json"}) : null;
  // On iPhone the share sheet lets you "Save to Files"; elsewhere, download the file.
  if (file && navigator.canShare && navigator.canShare({files: [file]}) && /iPhone|iPad|Android/i.test(navigator.userAgent)){
    navigator.share({files: [file], title: "Lift Log backup"}).then(done).catch(err => { if (err && err.name !== "AbortError") downloadBlob(blob, name, done); });

}
function downloadBlob(blob, name, cb){

}
function validBackup(o){
  const d = o && (o.app === "lift-log" ? o.data : o);

  if (d.habits != null && (!Array.isArray(d.habits) || !d.habits.every(h => h && h.id && typeof h.name === "string"))) return null;
  if (d.habitLog != null && (typeof d.habitLog !== "object" || Array.isArray(d.habitLog))) return null;
  if (!d.workouts.every(w => w && typeof w.date === "string" && Array.isArray(w.ex))) return null;

}
function importFile(f){
  const rd = new FileReader();
  rd.onload = async () => {
    let d = null; try { d = validBackup(JSON.parse(rd.result)); } catch (e) {}
    if (!d) return toast("⚠️ That file isn't a Lift Log backup");
    const hasHabits = Array.isArray(d.habits);
    const ok = await confirmBox("Restore this backup?", {ok: "Replace my data", danger: true, sub: `The backup has ${d.workouts.length} workouts, ${(d.body || []).length} body entries${hasHabits ? ` and ${d.habits.length} habits (${Object.keys(d.habitLog || {}).length} days logged)` : ""}. It will replace what's on this phone now (${S.workouts.length} workouts).${hasHabits ? "" : " This older backup has no habits, so your current habits stay as they are."}`});
    if (!ok) return;
    const keepBackupDate = S.settings.lastBackup, keepHabits = S.habits, keepLog = S.habitLog;
    S = Object.assign(DEFAULT(), d); S.settings = Object.assign(DEFAULT().settings, d.settings || {}); S.settings.lastBackup = S.settings.lastBackup || keepBackupDate;
    ["workouts","templates","body","customEx"].forEach(k => { if (!Array.isArray(S[k])) S[k] = []; });
    if (!hasHabits){ S.habits = keepHabits; S.habitLog = keepLog; }
    fixHabits();
    S.restEnd = null; save(); buildLib(); ED.live = null; renderAll(); toast(`Restored ${S.workouts.length} workouts ✓`);
  };
  rd.readAsText(f);
}

/* ===================== HABITS =====================
 * S.habits:   [{id, name, emoji, days:[0-6 weekdays it's scheduled], target:null|number, unit, on, created:"YYYY-MM-DD"}]
 * S.habitLog: {"YYYY-MM-DD": {habitId: count}}  (count ≥ target, or ≥ 1 for simple habits, means done)
 * Streaks and percentages only look at scheduled days, so an unscheduled day never breaks a streak. */
const ALLDAYS = [0, 1, 2, 3, 4, 5, 6];
function starterHabits(){
  const t = ymd(), h = (emoji, name, extra = {}) => ({id: uid(), emoji, name, days: ALLDAYS.slice(), target: null, unit: "", on: true, created: t, ...extra});
  return [
    h("🥩", "Hit protein target"),
    h("💧", "Drink water goal", {target: 8, unit: "glasses"}),
    h("😴", "7+ hours sleep"),
    h("🚶", "Daily step goal / walk"),
    h("💊", "Creatine / vitamins"),
    h("🧘", "Mobility / stretching", {days: [1, 3, 6, 0]}),
    h("🌙", "No late-night snacking"),
    h("📝", "Coach homework", {days: [2, 4, 5], on: false, example: true})
  ];
}
function fixHabits(){
  if (!Array.isArray(S.habits)) S.habits = starterHabits();
  if (!S.habitLog || typeof S.habitLog !== "object" || Array.isArray(S.habitLog)) S.habitLog = {};
  S.habits.forEach(h => { if (!Array.isArray(h.days) || !h.days.length) h.days = ALLDAYS.slice(); if (!h.created) h.created = ymd(); if (h.on === undefined) h.on = true; });
}
const hCount = (h, d) => (S.habitLog[d] && S.habitLog[d][h.id]) || 0;
const hGoal = h => h.target && h.target > 1 ? h.target : 1;
const hDone = (h, d) => hCount(h, d) >= hGoal(h);
const hSched = (h, d) => h.days.includes(parseYmd(d).getDay());
function hStart(h){ // first day that counts: creation date, or the earliest day he logged it
  let s = h.created || ymd();
  for (const d in S.habitLog) if (d < s && S.habitLog[d][h.id]) s = d;
  return s;
}
function setCount(h, d, n){
  n = Math.max(0, Math.min(99, Math.round(n)));
  if (!S.habitLog[d]) S.habitLog[d] = {};
  if (n) S.habitLog[d][h.id] = n; else delete S.habitLog[d][h.id];
  if (!Object.keys(S.habitLog[d]).length) delete S.habitLog[d];
  save();
}
function habitStats(h){
  const today = ymd(), start = hStart(h);
  // current streak: walk back from today over scheduled days; today still pending doesn't break it
  let cur = 0, d = parseYmd(today);
  for (let i = 0; i < 3660; i++, d = addDays(d, -1)){
    const ds = ymd(d); if (ds < start) break;
    if (!hSched(h, ds)) continue;
    if (hDone(h, ds)) cur++; else if (ds === today) continue; else break;
  }
  // best streak: walk forward from the start
  let best = 0, run = 0;
  for (let x = parseYmd(start); ymd(x) <= today; x = addDays(x, 1)){
    const ds = ymd(x); if (!hSched(h, ds)) continue;
    if (hDone(h, ds)){ run++; best = Math.max(best, run); } else if (ds !== today) run = 0;
  }
  // last 30 days (today counts only once it's done)
  let sch = 0, dn = 0;
  for (let i = 0; i < 30; i++){
    const ds = ymd(addDays(parseYmd(today), -i)); if (ds < start) break;
    if (!hSched(h, ds)) continue;
    if (hDone(h, ds)){ sch++; dn++; } else if (ds !== today) sch++;
  }
  let total = 0; for (const k in S.habitLog) if (S.habitLog[k][h.id] >= hGoal(h)) total++;
  return {cur, best, pct: sch ? Math.round(dn / sch * 100) : null, sch30: sch, done30: dn, total};
}
function dayScore(ds){
  const hs = S.habits.filter(h => h.on && hSched(h, ds) && ds >= hStart(h));
  return {done: hs.filter(h => hDone(h, ds)).length, total: hs.length};
}
function weekHabitScore(){
  const mon = mondayOf(new Date()), today = ymd();
  let done = 0, sched = 0, full = 0;
  for (let i = 0; i < 7; i++){
    const ds = ymd(addDays(mon, i));
    S.habits.forEach(h => { if (!h.on || !hSched(h, ds)) return; if (ds >= (h.created || today) || ds >= hStart(h)) full++; if (ds > today || ds < hStart(h)) return; sched++; if (hDone(h, ds)) done++; });
  }
  return {done, sched, full, pct: sched ? Math.round(done / sched * 100) : 0};
}
function habitsSummaryHTML(){
  if (!S.habits.some(h => h.on)) return "";
  const t = dayScore(ymd()), w = weekHabitScore();
  return `<button class="hsum" id="hSum"><span class="hsum-ring" style="--p:${t.total ? t.done / t.total * 100 : 0}"><span>${t.done}/${t.total}</span></span>
    <span class="grow"><b>Habits today</b><br><span class="small muted">${t.total && t.done === t.total ? "All done. Nice! 🔥" : `${t.total - t.done} left`} · this week ${w.done}/${w.sched} (${w.pct}%)</span></span><span class="muted" style="font-size:22px">›</span></button>`;
}

let habDay = null;
const EMOJIS = ["✅","🥩","💧","😴","🚶","💊","🧘","🌙","📝","🏃","🥗","🍎","🚭","🍺","📵","📖","🧊","☀️","🧠","❤️","🦵","🏋️","⏰","🙏"];

      return `<button data-day="${xs}" class="${xs === habDay ? "on" : ""}${fut ? " fut" : ""}${!fut && s.total && s.done === s.total ? " full" : ""}" ${fut ? "disabled" : ""}><span>${DOW[x.getDay()].slice(0, 2)}</span><b>${x.getDate()}</b><small>${fut || !s.total ? "&nbsp;" : `${s.done}/${s.total}`}</small></button>`; }).join("")}</div>

      ${unsched.length ? `<div class="lbl" style="margin:16px 4px 8px">Not scheduled ${habDay === today ? "today" : "this day"} · optional</div>${unsched.map(h => row(h, " unsched")).join("")}` : ""}

function calendarHTML(h, monthDate){

function editHabit(h){

      <div class="daypick" id="heDays" style="margin-top:8px;${f.days.length === 7 ? "display:none" : ""}">${[1, 2, 3, 4, 5, 6, 0].map(d => `<button data-d="${d}" class="${f.days.includes(d) ? "on" : ""}">${DOW[d]}</button>`).join("")}</div>
      <div class="btn-row" id="heQuick" style="margin-top:8px;${f.days.length === 7 ? "display:none" : ""}"><button class="btn sm" data-q="train">Lift days</button><button class="btn sm" data-q="rest">Rest days</button><button class="btn sm" data-q="wk">Weekdays</button></div></div>
    <div class="field"><label>Daily count <span style="text-transform:none;font-weight:500">(optional)</span></label>
      <div class="row"><div class="stepper"><button data-t="-1" aria-label="Lower target">−</button><output id="heT">${f.target > 1 ? f.target : "Off"}</output><button data-t="1" aria-label="Raise target">＋</button></div>
      <input class="inp grow" id="heUnit" value="${esc(f.unit || "")}" placeholder="unit, e.g. glasses" maxlength="16"></div>
      <span class="small muted">Use a count for things like 8 glasses of water. Leave it off for a simple check.</span></div>
    <label class="toggle"><span><b>Active</b><br><span class="small muted">Turned-off habits are hidden and don't count</span></span><span class="switch"><input type="checkbox" id="heOn" ${f.on ? "checked" : ""}><span></span></span></label>
    <button class="btn primary" id="heSave" style="margin-top:10px">${isNew ? "Add habit" : "Save changes"}</button>
    ${isNew ? "" : `<button class="btn danger" id="heDel" style="margin-top:10px">🗑 Delete habit</button>`}`,
    onMount: b => {
      const syncDays = () => $$("#heDays button", b).forEach(x => x.classList.toggle("on", f.days.includes(+x.dataset.d)));
      b.addEventListener("click", async e => {
        const em = e.target.closest("[data-e]"); if (em){ f.emoji = em.dataset.e; $("#heEmoji", b).value = f.emoji; $$(".epick button", b).forEach(x => x.classList.toggle("on", x === em)); return; }
        const md = e.target.closest("[data-mode]"); if (md){ const all = md.dataset.mode === "all"; $$("#heMode button", b).forEach(x => x.classList.toggle("on", x === md)); $("#heDays", b).style.display = all ? "none" : ""; $("#heQuick", b).style.display = all ? "none" : ""; f.days = all ? ALLDAYS.slice() : (f.days.length === 7 ? S.settings.days.slice() : f.days); syncDays(); return; }
        const dd = e.target.closest("#heDays [data-d]"); if (dd){ const d = +dd.dataset.d; f.days = f.days.includes(d) ? f.days.filter(x => x !== d) : [...f.days, d]; syncDays(); return; }
        const q = e.target.closest("[data-q]"); if (q){ f.days = q.dataset.q === "train" ? S.settings.days.slice() : q.dataset.q === "rest" ? ALLDAYS.filter(x => !S.settings.days.includes(x)) : [1, 2, 3, 4, 5]; syncDays(); return; }
        const t = e.target.closest("[data-t]"); if (t){ let v = (f.target > 1 ? f.target : 1) + +t.dataset.t; if (v === 2 && +t.dataset.t > 0 && !(f.target > 1)) v = 2; f.target = v <= 1 ? null : Math.min(50, v); $("#heT", b).textContent = f.target || "Off"; return; }
        if (e.target.closest("#heSave")){
          f.name = $("#heName", b).value.trim(); f.emoji = $("#heEmoji", b).value.trim() || "✅"; f.unit = $("#heUnit", b).value.trim(); f.on = $("#heOn", b).checked;
          if (!f.name){ $("#heName", b).focus(); return toast("Give the habit a name"); }
          if (!f.days.length) return toast("Pick at least one day");
          delete f.example;
          if (isNew) S.habits.push(f); else Object.assign(h, f);
          save(); closeSheet(r.m); refreshHabitViews(); toast(isNew ? `Added ${f.name}` : "Habit saved");
        }
        if (e.target.closest("#heDel")){
          const ok = await confirmBox(`Delete “${h.name}”?`, {ok: "Delete", danger: true, sub: "Its check-off history will be removed too. To keep the history, turn it off instead."});
          if (!ok) return;
          S.habits = S.habits.filter(x => x.id !== h.id);
          for (const d in S.habitLog){ delete S.habitLog[d][h.id]; if (!Object.keys(S.habitLog[d]).length) delete S.habitLog[d]; }
          save(); closeSheet(r.m); refreshHabitViews(); toast("Habit deleted");
        }
      });
      if (isNew) setTimeout(() => $("#heName", b).focus(), 50);
    }});
}
function manageHabits(){
  const r = openSheet({title: "Manage habits", full: true, body: `<div id="mhBody"></div>`, onClose: refreshHabitViews,
    onMount: b => {
      const draw = () => {
        $("#mhBody", b).innerHTML = `<p class="sub" style="margin:0 0 12px">Reorder, turn habits on or off, or tap Edit to rename, change the icon, schedule or count.</p>
          ${S.habits.map((h, i) => `<div class="list-item mh" data-i="${i}"><span class="hemo" style="width:36px;height:36px;font-size:20px">${esc(h.emoji)}</span>
            <div class="grow"><div class="nm"${h.on ? "" : " style='opacity:.5'"}>${esc(h.name)}</div><div class="ds">${h.days.length === 7 ? "Every day" : h.days.slice().sort((a, c) => ((a + 6) % 7) - ((c + 6) % 7)).map(x => DOW[x]).join(" ")}${h.target > 1 ? ` · ${h.target} ${esc(h.unit || "")}` : ""}${h.example ? " · example" : ""}</div></div>
            <button class="mhb" data-m="up" ${i === 0 ? "disabled" : ""} aria-label="Move up">↑</button><button class="mhb" data-m="down" ${i === S.habits.length - 1 ? "disabled" : ""} aria-label="Move down">↓</button>
            <label class="switch"><input type="checkbox" data-m="on" ${h.on ? "checked" : ""} aria-label="${esc(h.name)} on"><span></span></label>
            <button class="mhb" data-m="edit" aria-label="Edit ${esc(h.name)}">✏️</button></div>`).join("") || `<div class="empty">No habits yet.</div>`}
          <button class="btn primary" data-m="add" style="margin-top:6px">＋ Add habit</button>
          <button class="btn ghost small" data-m="starters" style="margin-top:6px;min-height:44px">Add back the starter habits</button>`;
      };
      draw();
      b.addEventListener("click", e => {
        const m = e.target.closest("[data-m]"); if (!m || m.disabled) return;
        const it = m.closest("[data-i]"), i = it ? +it.dataset.i : -1, k = m.dataset.m;
        if (k === "on") return; // handled by change
        if (k === "up" || k === "down"){ const j = k === "up" ? i - 1 : i + 1; [S.habits[i], S.habits[j]] = [S.habits[j], S.habits[i]]; save(); draw(); }
        if (k === "edit"){ closeSheet(r.m); editHabit(S.habits[i]); }
        if (k === "add"){ closeSheet(r.m); editHabit(null); }
        if (k === "starters"){ const have = new Set(S.habits.map(h => h.name.toLowerCase())); const add = starterHabits().filter(h => !have.has(h.name.toLowerCase())); S.habits.push(...add); save(); draw(); toast(add.length ? `Added ${add.length} starter habit${add.length > 1 ? "s" : ""}` : "You already have all the starters"); }
      });
      b.addEventListener("change", e => { const m = e.target.closest('[data-m="on"]'); if (!m) return; const h = S.habits[+m.closest("[data-i]").dataset.i]; h.on = m.checked; save(); draw(); });
    }});
}
function refreshHabitViews(){ if (currentView === "habits") renderHabits(); if (currentView === "today") renderToday(); }

/* ===================== NAV + INIT ===================== */
let currentView = "today";
function showView(v){
  currentView = v;
  $$(".view").forEach(x => x.classList.toggle("active", x.id === "view-" + v));
  $$("nav button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  if (v === "habits" && currentView !== "habits") habDay = null;
  if (v === "today") renderToday();
  if (v === "history") renderHistory();
  if (v === "progress") renderProgress();
  if (v === "me") renderMe();
  if (v === "habits") renderHabits();
}
function renderAll(){ showView(currentView); tickHeader(); }
document.querySelector("nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) showView(b.dataset.view); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheets.length) closeSheet(); });
let resizeT; window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (currentView === "progress") renderProgress(); }, 200); });

load(); buildLib(); renderAll();
if (S.restEnd){ if (S.restEnd > Date.now()){ $("#rest").classList.add("show"); tickRest(); } else { S.restEnd = null; save(); } }
setInterval(() => { tickRest(); if (S.active) tickHeader(); }, 250);
wakeOn();

/* offline / install (only over http(s); harmless when opened as a file) */
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
